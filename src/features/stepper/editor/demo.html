<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Code editor harness · Stack Step</title>
    <!--
      A developer page for the code editor (CodeEditor.tsx). It is NOT part of the site:
      index.html does not link to it and the production build leaves it out.

        npx vite --port 5192 --strictPort
        http://localhost:5192/src/features/stepper/editor/demo.html

      Add ?theme=dark or ?theme=light to start in that theme (tests and screenshots).
    -->
    <script>
      // Pick light or dark before the first paint, like index.html.
      ;(function () {
        var wanted = new URLSearchParams(window.location.search).get('theme')
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        if (wanted === 'dark' || (wanted !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <style>
      /* Styles of the harness only. The editor brings its own. */
      .demo-page {
        box-sizing: border-box;
        max-width: 68rem;
        margin: 0 auto;
        /* Room below, so that tests can scroll the page past the editor. */
        padding: 1rem 1rem 70vh;
      }
      .demo-title {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 700;
      }
      .demo-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.75rem;
        margin: 0.5rem 0;
      }
      .demo-frame {
        height: min(60vh, 30rem);
        border: 1px solid var(--c-line-strong);
        border-radius: 0.75rem;
        background: var(--c-code-bg);
      }
      .demo-editor {
        border-radius: 0.75rem;
      }
      .demo-loading {
        margin: 0;
        padding: 1rem;
        color: var(--c-muted);
      }
      .demo-group {
        min-width: 0;
        margin: 0.75rem 0 0;
        padding: 0.5rem 0.75rem 0.75rem;
        border: 1px solid var(--c-line);
        border-radius: 0.5rem;
      }
      .demo-group > legend {
        padding: 0 0.25rem;
        font-size: 0.875rem;
        font-weight: 700;
      }
      .demo-page label {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.875rem;
      }
      .demo-page button,
      .demo-page select,
      .demo-page input {
        min-height: 2.25rem;
        max-width: 100%;
        padding: 0.25rem 0.625rem;
        border: 1px solid var(--c-line-strong);
        border-radius: 0.5rem;
        background: var(--c-surface);
        color: var(--c-ink);
        font: inherit;
        font-size: 0.875rem;
      }
      .demo-page button {
        cursor: pointer;
        font-weight: 600;
      }
      .demo-page input[type='number'] {
        width: 4.5rem;
      }
      .demo-facts {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
        margin: 0.5rem 0 0;
        font-size: 0.875rem;
      }
      .demo-facts div {
        display: flex;
        gap: 0.375rem;
      }
      .demo-facts dt {
        color: var(--c-muted);
      }
      .demo-facts dd {
        margin: 0;
        font-family: var(--font-mono);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./demo.tsx"></script>
  </body>
</html>
